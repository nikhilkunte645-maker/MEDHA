<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" fill="none">
  <!-- MEDHA Dark Monochrome — for light backgrounds -->

  <!-- M-node strokes: deep navy -->
  <line x1="10" y1="50" x2="20" y2="22" stroke="#0B1224" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="22" x2="29" y2="40" stroke="#0B1224" stroke-width="3" stroke-linecap="round"/>
  <line x1="29" y1="40" x2="38" y2="22" stroke="#0B1224" stroke-width="3" stroke-linecap="round"/>
  <line x1="38" y1="22" x2="48" y2="50" stroke="#0B1224" stroke-width="3" stroke-linecap="round"/>

  <!-- Accent: dark dashes -->
  <line x1="10" y1="50" x2="29" y2="40" stroke="#0B1224" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4" stroke-linecap="round"/>
  <line x1="48" y1="50" x2="29" y2="40" stroke="#0B1224" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4" stroke-linecap="round"/>

  <!-- Nodes: deep navy -->
  <circle cx="10" cy="50" r="4" fill="#0B1224"/>
  <circle cx="10" cy="50" r="2" fill="#ffffff"/>
  <circle cx="20" cy="22" r="4" fill="#0B1224"/>
  <circle cx="20" cy="22" r="2" fill="#ffffff"/>
  <circle cx="29" cy="40" r="3" fill="#0B1224" opacity="0.7"/>
  <circle cx="38" cy="22" r="4" fill="#0B1224"/>
  <circle cx="38" cy="22" r="2" fill="#ffffff"/>
  <circle cx="48" cy="50" r="4" fill="#0B1224"/>
  <circle cx="48" cy="50" r="2" fill="#ffffff"/>

  <!-- Wordmark: deep navy -->
  <text x="68" y="47"
        font-family="'Inter', 'DM Sans', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="28" letter-spacing="4"
        fill="#0B1224">MEDHA</text>

  <text x="69" y="60"
        font-family="'Inter', 'DM Sans', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="8" letter-spacing="2.5"
        fill="#0B1224" opacity="0.6">ADAPTIVE AI LEARNING</text>
</svg>
