<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- MEDHA Favicon: simplified M-node mark on indigo background -->
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#6366F1"/>

  <!-- M-node strokes: white -->
  <!-- Nodes: L=(8,50) TL=(18,14) V=(32,36) TR=(46,14) R=(56,50) -->
  <line x1="8"  y1="50" x2="18" y2="14" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="18" y1="14" x2="32" y2="36" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="32" y1="36" x2="46" y2="14" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="46" y1="14" x2="56" y2="50" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Accent nodes at terminals and valley -->
  <circle cx="8"  cy="50" r="4" fill="#22D3EE"/>
  <circle cx="18" cy="14" r="3.5" fill="#ffffff"/>
  <circle cx="32" cy="36" r="3" fill="#14B8A6"/>
  <circle cx="46" cy="14" r="3.5" fill="#ffffff"/>
  <circle cx="56" cy="50" r="4" fill="#22D3EE"/>
</svg>
