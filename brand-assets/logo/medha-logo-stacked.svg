<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" fill="none">
  <!-- MEDHA Stacked Logo — Symbol above Wordmark -->

  <!-- Symbol centered at x=80, nodes scaled for 64px wide -->
  <!-- Offset: symbol starts at x=27 (80-32) -->
  <g transform="translate(27,6)">
    <line x1="0"  y1="47" x2="11" y2="9"  stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>
    <line x1="11" y1="9"  x2="21" y2="32" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>
    <line x1="21" y1="32" x2="31" y2="9"  stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>
    <line x1="31" y1="9"  x2="42" y2="47" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>

    <line x1="0"  y1="47" x2="21" y2="32" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.65" stroke-linecap="round"/>
    <line x1="42" y1="47" x2="21" y2="32" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.65" stroke-linecap="round"/>

    <circle cx="0"  cy="47" r="4.5" fill="#6366F1"/>
    <circle cx="0"  cy="47" r="2.2" fill="#22D3EE"/>
    <circle cx="11" cy="9"  r="4.5" fill="#6366F1"/>
    <circle cx="11" cy="9"  r="2.2" fill="#ffffff"/>
    <circle cx="21" cy="32" r="3.5" fill="#14B8A6"/>
    <circle cx="21" cy="32" r="1.7" fill="#ffffff"/>
    <circle cx="31" cy="9"  r="4.5" fill="#6366F1"/>
    <circle cx="31" cy="9"  r="2.2" fill="#ffffff"/>
    <circle cx="42" cy="47" r="4.5" fill="#6366F1"/>
    <circle cx="42" cy="47" r="2.2" fill="#22D3EE"/>
  </g>

  <!-- Wordmark: MEDHA -->
  <text x="80" y="90"
        text-anchor="middle"
        font-family="'Inter', 'DM Sans', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700"
        font-size="22"
        letter-spacing="5"
        fill="#111827">MEDHA</text>

  <!-- Sub-brand -->
  <text x="80" y="104"
        text-anchor="middle"
        font-family="'Inter', 'DM Sans', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400"
        font-size="6.5"
